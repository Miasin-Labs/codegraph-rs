[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "codegraph-rs"
version = "0.1.0"
description = "In-process Python bindings for codegraph-rs semantic code intelligence"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
module-name = "codegraph_rs._native"
python-source = "."
features = ["pyo3/extension-module"]
