[package]
name = "codegraph-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for codegraph-rs (in-process engine, no MCP server needed)"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
codegraph-rs = { path = ".." }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
crossbeam-channel = "0.5"
