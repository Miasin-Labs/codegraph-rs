- id: rust-xss
  description: Request input is written into an HTML response without escaping (CWE-79).
  severity: medium
  confidence: 0.7
  tags: [CWE-79, taint]
  language: rust
  message: "untrusted input `{source}` is written into HTML"
  taint:
    sources: *rust-web-sources
    sinks:
      - name: html
        query: |
          ((call_expression function: [(identifier) (scoped_identifier)] @f arguments: (arguments . (_) @arg))
           (#match? @f "(^|::)Html$"))
        argument: arg
        where:
          - capture: f
            resolves-to: "^(<unresolved>|axum::.*|axum_core::.*)$"
      - name: html-body
        query: |
          ((call_expression function: (field_expression value: (_) @chain field: (field_identifier) @m) arguments: (arguments . (_) @arg))
           (#eq? @m "body") (#match? @chain "(?i)text/html|TEXT_HTML"))
        argument: arg
    sanitizers:
      - name: escape
        query: |
          ((call_expression function: [(identifier) @f (scoped_identifier name: (identifier) @f) (field_expression field: (field_identifier) @f)]) @v
           (#match? @f "^(escape|encode_text|encode_safe|encode_minimal|encode_double_quoted_attribute|encode_quoted_attribute|escape_html|html_escape|clean|render|render_once|into_string)$"))
        value: v
      - name: number
        query: |
          ((call_expression function: (generic_function function: (field_expression field: (field_identifier) @m)
                                                       type_arguments: (type_arguments (primitive_type) @t))) @v
           (#eq? @m "parse"))
        value: v
    guards: *rust-generic-guards
  review:
    - Is the response served as HTML, and can the input carry markup (`<script>`, an attribute break)?
    - Escape with a template engine's auto-escaping (askama, maud) or `html_escape::encode_text`.
  examples:
    bad:
      - |
        async fn hello(Query(q): Query<Hello>) -> Html<String> {
            Html(format!("<h1>Hello {}</h1>", q.name))
        }
      - |
        async fn hello(req: HttpRequest) -> HttpResponse {
            let name = req.match_info().get("name").unwrap_or("");
            HttpResponse::Ok().content_type("text/html").body(format!("<p>{name}</p>"))
        }
    good:
      - |
        async fn hello(Query(q): Query<Hello>) -> Html<String> {
            let name = html_escape::encode_text(&q.name);
            Html(format!("<h1>Hello {name}</h1>"))
        }
      - |
        async fn hello(Query(q): Query<Hello>) -> Html<String> {
            Html(HelloTemplate { name: q.name }.render().unwrap())
        }

- id: rust-allocation-from-input
  description: A length decoded from input sizes an allocation with no bound (memory exhaustion, CWE-789, CWE-400).
  severity: medium
  confidence: 0.5
  tags: [CWE-789, CWE-400, taint]
  language: rust
  message: "a length decoded from input (`{source}`) sizes an allocation with no bound"
  taint:
    sources:
      - name: decoded-integer
        query: |
          ((call_expression function: [(field_expression field: (field_identifier) @m)
                                       (scoped_identifier name: (identifier) @m)
                                       (generic_function function: (field_expression field: (field_identifier) @m))]) @v
           (#match? @m "^(read_u16|read_u32|read_u64|read_i32|read_i64|read_u16_le|read_u32_le|read_u64_le|read_u16_be|read_u32_be|read_u64_be|get_u16|get_u32|get_u64|get_u16_le|get_u32_le|get_u64_le|from_be_bytes|from_le_bytes|read_varint|read_uvarint|decode_varint)$"))
        value: v
      - name: header-length
        query: |
          ((call_expression function: (field_expression value: (_) @h field: (field_identifier) @m)) @v
           (#match? @m "^(content_length)$"))
        value: v
    sinks:
      - name: with-capacity
        query: |
          ((call_expression function: [(scoped_identifier name: (identifier) @m) (field_expression field: (field_identifier) @m)] arguments: (arguments . (_) @arg))
           (#match? @m "^(with_capacity|reserve|reserve_exact)$"))
        argument: arg
      - name: resize
        query: |
          ((call_expression function: (field_expression field: (field_identifier) @m) arguments: (arguments . (_) @arg))
           (#eq? @m "resize"))
        argument: arg
      - name: vec-repeat
        query: |
          ((macro_invocation macro: (identifier) @m (token_tree (_) ";" (_) @arg)) @call
           (#eq? @m "vec"))
        argument: call
    sanitizers:
      - name: min
        query: |
          ((call_expression function: (field_expression field: (field_identifier) @m)) @v
           (#match? @m "^(min|clamp)$"))
        value: v
    guards:
      - name: upper-bound
        query: |
          ((binary_expression left: (_) @v operator: [">" ">="] right: (_)) @check)
        value: v
        check: check
        safe: when-false
      - name: upper-bound-kept
        query: |
          ((binary_expression left: (_) @v operator: ["<" "<="] right: (_)) @check)
        value: v
        check: check
      - name: bound-first
        query: |
          ((binary_expression left: (_) operator: ["<" "<="] right: (_) @v) @check)
        value: v
        check: check
        safe: when-false
      - name: bound-first-kept
        query: |
          ((binary_expression left: (_) operator: [">" ">="] right: (_) @v) @check)
        value: v
        check: check
  review:
    - Is the length bounded (against a constant, or the bytes actually left) before the allocation?
    - Would `try_reserve`, a capped `with_capacity(n.min(MAX))`, or reading incrementally be safer?
  examples:
    bad:
      - |
        fn decode(r: &mut impl Read) -> io::Result<Vec<u8>> {
            let n = r.read_u32::<BigEndian>()? as usize;
            let mut buf = Vec::with_capacity(n);
            r.take(n as u64).read_to_end(&mut buf)?;
            Ok(buf)
        }
      - |
        fn decode(data: &[u8]) -> Vec<u8> {
            let len = u32::from_le_bytes([data[0], data[1], data[2], data[3]]) as usize;
            let mut out = Vec::new();
            out.resize(len, 0);
            out
        }
    good:
      - |
        fn decode(r: &mut impl Read) -> io::Result<Vec<u8>> {
            let n = r.read_u32::<BigEndian>()? as usize;
            if n > MAX_LEN {
                return Err(io::ErrorKind::InvalidData.into());
            }
            let mut buf = Vec::with_capacity(n);
            Ok(buf)
        }
      - |
        fn decode(data: &[u8]) -> Vec<u8> {
            let len = u32::from_le_bytes([data[0], data[1], data[2], data[3]]) as usize;
            Vec::with_capacity(len.min(4096))
        }
