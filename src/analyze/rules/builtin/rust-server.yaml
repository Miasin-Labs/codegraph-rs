# Rust network-server hardening: timing-unsafe secret compares, HTTP clients
# that follow redirects (SSRF), accept loops that die on one error or never
# cap connections, subprocesses and peer reads with no deadline. Written from
# a real server's security audit (each rule caught its fixed bug before the
# fix and was silent after). Suppress a site that is fine with
# `// codegraph: ignore <rule-id> — why`.
id: rust-secret-compare-not-constant-time
description: >-
  A secret (token, password, key, signature) is compared with `==`/`!=`,
  which returns at the first differing byte: response timing leaks how much
  of a guess was right (CWE-208).
severity: medium
tags: [CWE-208, timing]
language: rust
# A secret is named as one (`token`, `api_key`, `signature`…), or is the
# `expected` value of a credential check. On 10 real projects (2026-09) a
# bare `expected`/`actual` outside auth code was a status code, a schema, a
# state machine or a test assertion (17 of 18 judged), a bare `token` a
# lexer word, `*_tokens` LLM token counts, and a comparison with secrets on
# both sides was reported twice. So `expected` counts only inside a
# function named for credentials or handling them; a bare `token`, plural
# `tokens`, public keys, hashes and sizes never; and the right-hand pattern
# leaves a named secret on the left to the left-hand one.
check-patterns:
  - name: secret-on-the-left
    query: |
      (binary_expression left: (_) @secret operator: ["==" "!="] right: (_) @other) @cmp
    at: cmp
    where:
      - capture: secret
        regex: &secret-words "(?i)(token|secret|password|passwd|passcode|api_?key|hmac|signature)"
      - capture: secret
        not-regex: &not-secret "(?i)(\\.len\\(\\)|is_empty|_len\\b|\\bcount|_count|kind|type|name|header|none|epoch|generation|version|crc|checksum|default\\(\\)|tokens|public_?key|pubkey)|^[*&]*token$|token\\.(slug|id|kind|label|scope\\w*|sub|exp\\w*|iat|issued\\w*|user\\w*|\\w+_at)\\b|^&?b?\"|(?-i:(^|::)[A-Z][A-Z0-9_]*$)"
      - capture: other
        not-regex: &not-other "^(None|Some\\(\\w+\\)|\"\"|0|true|false)$|\\.len\\(\\)|^&?b?\"|default\\(\\)|(?i)crc|checksum|generation|epoch|version|(?-i:(^|::)[A-Z][A-Z0-9_]*$)"
  - name: secret-on-the-right
    query: |
      (binary_expression left: (_) @other operator: ["==" "!="] right: (_) @secret) @cmp
    at: cmp
    where:
      - capture: secret
        regex: *secret-words
      - capture: secret
        not-regex: *not-secret
      - capture: other
        not-regex: *not-other
      # A named secret on the left is the left-hand pattern's finding.
      - capture: other
        not-regex: "(?i)([._]\\w*|^\\w+_)(token|secret|password|passwd|passcode|api_?key|hmac)$"
  - name: expected-on-the-left
    query: |
      (binary_expression left: (_) @secret operator: ["==" "!="] right: (_) @other) @cmp
    at: cmp
    where:
      - capture: secret
        regex: "(?i)expected"
      - capture: secret
        not-regex: &not-expected "(?i)(token|secret|password|passwd|passcode|api_?key|hmac|signature|hash|digest|sha\\d|len|count|size|version|status|kind|type|calls|crc|checksum|generation|epoch)|(?-i:(^|::)[A-Z][A-Z0-9_]*$)"
      - capture: other
        not-regex: *not-other
      - inside: &credential-fn |
          ((function_item name: (identifier) @n) @f
           (#match? @n "(?i)(auth|token|bootstrap|bearer|secret|passw|csrf|state|nonce|hmac|signature|api_?key|credential|login|otp|admin)"))
          ((function_item) @g
           (#match? @g "(?i)(bearer|authorization|x-api-key|password)"))
  - name: expected-on-the-right
    query: |
      (binary_expression left: (_) @other operator: ["==" "!="] right: (_) @secret) @cmp
    at: cmp
    where:
      - capture: secret
        regex: "(?i)expected"
      - capture: secret
        not-regex: *not-expected
      - capture: other
        not-regex: *not-other
      - capture: other
        not-regex: "(?i)expected"
      - inside: *credential-fn
message: "`{cmp}` compares a secret with a short-circuiting comparison"
review:
  - Is the compared value a credential an attacker can guess against (a header, a cookie, a query param)?
  - Use a constant-time compare (`subtle::ConstantTimeEq`, or fold over XORed bytes after a length check).
examples:
  bad:
    - |
      fn check_admin(expected: &str, given: &str) -> bool { given.as_bytes() != expected.as_bytes() }
    - |
      fn ok(req_token: &str, cfg: &Cfg) -> bool { req_token == cfg.admin_token }
    - |
      fn validate_state(expected: &str, received: &str) -> bool { expected != received }
    - |
      fn authed(&self, id: u64, token: &str) -> bool { self.entries[&id].read_write_token != token }
    - |
      fn cas(account: &Account, expected_refresh_token: &str) -> bool { account.refresh_token != expected_refresh_token }
    - |
      fn handshake(req: &Request, token: &str) -> bool { let expected = format!("bearer.{token}"); req.headers().get("authorization").is_some_and(|p| p == &expected) }
  good:
    - |
      fn check(given: &str, expected: &str) -> bool { token_matches(given, expected) }
    - |
      fn empty(token: &str) -> bool { token.len() == 0 }
    - |
      fn missing(token: Option<&str>) -> bool { token == None }
    - |
      fn grant(grant: &str) -> bool { grant == "refresh_token" }
    - |
      fn live(epoch: Option<i64>, token_epoch: i64) -> bool { epoch != Some(token_epoch) }
    - |
      fn ok(data: &[u8], expected: u32) -> bool { crc32c(data) == expected }
    - |
      fn none(secrets: &Secrets) -> bool { secrets == Secrets::default() }
    - |
      fn raw(key: &str) -> bool { key == RAW_VALUE_TOKEN }
    - |
      fn cas(expected: Option<u64>, generation: u64) -> bool { expected.is_some_and(|expected| expected != generation) }
    - |
      fn decode(resp: Response) -> bool { let expected = StatusCode::OK; resp.status != expected }
    - |
      fn json_mismatch(actual: &Value, expected: &Value) -> bool { actual != expected }
    - |
      fn parse(token: &str) -> Option<Action> { ALL.into_iter().find(|a| a.as_str() == token) }
    - |
      fn sync(entry: &Entry, agent: &Agent) -> bool { entry.latest_input_tokens != agent.latest_input_tokens }
    - |
      fn slugs(tokens: &[Token], token: &Token) -> bool { tokens.iter().any(|other| other.slug == token.slug) }
    - |
      fn check_server_key(presented: &str, expected: &str) -> bool { presented == expected }
    - |
      fn plugin(h: &str) -> bool { h == host::BUILTIN_TOTAL_TOKENS_HANDLER }
    - |
      fn stale(t: &Token, at: Instant) -> bool { t.token.obtained_at == at }
---
id: rust-http-client-follows-redirects
description: >-
  A reqwest client is built without a redirect policy, so it follows up to 10
  redirects by default. A client pointed at a user-configured host can be
  redirected to an internal address, with whatever credentials the request
  carries (CWE-918, SSRF).
severity: medium
tags: [CWE-918, ssrf]
language: rust
# Only in server context: the client is built in code a route, request
# handler, listener or message handler reaches, or in a method of a type
# such code uses (`via-type`: `FeedManager::new` builds the client the
# routes reaching `FeedManager::article_to_epub` use). On 10 real
# checkouts (2026-09) 45 → 5: the 40 dropped were CLI tools and clients
# of fixed API hosts (27 judged before, all harmless); kept are rms's two
# audit fixes (feeds, Wallabag), its provider client (redirects by
# design) and two server-side clients of fixed hosts.
check-patterns:
  - name: builder-without-redirect-policy
    query: |
      ((call_expression function: (field_expression field: (field_identifier) @m)) @call
       (#eq? @m "build"))
    at: call
    where:
      - capture: call
        regex: "Client::builder\\(\\)|ClientBuilder::new\\(\\)"
      - capture: call
        not-regex: "\\.redirect\\("
      - reached-from: server
        via-type: true
  - name: default-client
    query: |
      ((call_expression function: (scoped_identifier path: (_) @ty name: (identifier) @f)) @call
       (#eq? @f "new"))
    at: call
    where:
      - capture: ty
        regex: "^(reqwest::)?Client$"
      - reached-from: server
        via-type: true
message: "reqwest client without a redirect policy (follows redirects by default)"
review:
  - Does this client ever talk to a URL a user or tenant configures? Then a redirect can point it at localhost or the cloud metadata address.
  - "`.redirect(reqwest::redirect::Policy::none())` unless the API is known to redirect."
examples:
  bad:
    - code: |
        fn c() -> reqwest::Client { reqwest::Client::builder().timeout(T).build().unwrap() }
      reached: true
    - code: |
        fn c() -> Client { Client::new() }
      reached: route
  good:
    - code: |
        fn c() -> reqwest::Client { reqwest::Client::builder().redirect(reqwest::redirect::Policy::none()).build().unwrap() }
      reached: true
    - code: |
        fn c() -> Foo { Foo::new() }
      reached: true
    # A CLI's client: no server entry point reaches it.
    - |
      fn c() -> reqwest::Client { reqwest::Client::builder().timeout(T).build().unwrap() }
    - code: |
        fn c() -> Client { Client::new() }
      reached: public-api
---
id: rust-accept-error-ends-server
description: >-
  `listener.accept().await?` inside the accept loop: one failed accept
  (EMFILE when file descriptors run out, ECONNABORTED) returns from the loop
  and the server stops listening for good (CWE-400).
severity: medium
tags: [CWE-400, dos]
language: rust
check-patterns:
  - name: accept-with-question-mark
    query: |
      ((try_expression (await_expression (call_expression function: (field_expression field: (field_identifier) @m) arguments: (arguments) @args))) @try
       (#eq? @m "accept"))
    at: try
    where:
      - inside: "(loop_expression) @loop"
      # A listener's `accept()` takes nothing; `tls.accept(stream)` is the
      # handshake of one connection.
      - capture: args
        regex: "^\\(\\s*\\)$"
message: "`{try}` ends the accept loop on the first accept error"
review:
  - Log the error, back off briefly (EMFILE clears as connections close) and `continue`.
examples:
  bad:
    - |
      async fn run(l: TcpListener) -> io::Result<()> { loop { let (s, _) = l.accept().await?; spawn(s); } }
  good:
    - |
      async fn run(l: TcpListener) { loop { let (s, _) = match l.accept().await { Ok(a) => a, Err(_) => continue }; spawn(s); } }
    - |
      async fn once(l: TcpListener) -> io::Result<()> { let (s, _) = l.accept().await?; spawn(s); Ok(()) }
    - |
      async fn tls(a: TlsAcceptor, s: TcpStream) -> io::Result<()> { loop { let t = a.accept(s).await?; serve(t).await; } }
---
id: rust-subprocess-without-deadline
description: >-
  A child process is run to completion (`output()`/`status()`/`wait()`) with
  no deadline anywhere in the function: input that makes the tool spin ties
  up the caller forever, and on an async worker, the whole runtime (CWE-400).
severity: medium
tags: [CWE-400, dos]
language: rust
# Waiting on a child is a bug where input decides how long it runs: in a
# server (a route, request handler, listener or message handler reaches the
# function), or wherever the child runs code or parses a file (an
# interpreter, a test runner, `docker run`, a document converter) — agents
# and CI tools run generated code that way. On 10 real checkouts
# (2026-09) 127 → 18: the 9 in server context hold rms's pdftotext and
# testsprite's runners of generated code; 9 code runners and converters
# outside servers stay at 0.45 (jfc's `cargo test` of a validator's test
# and `bash -c` of a task's check, ers's pdftotext of downloaded
# statements); the 109 dropped were CLIs waiting on `git` (55), `tmux`,
# `gh`, `gcloud`, `cargo build`, their own binaries. For the second
# pattern `Command::new("x")` must be in the call's chain, and `sh -c`
# with a literal script is no code runner.
check-patterns:
  - name: run-to-completion
    query: |
      ((call_expression function: (field_expression field: (field_identifier) @m)) @call
       (#match? @m "^(output|status|wait|wait_with_output)$"))
    at: call
    where:
      - enclosing-function:
          calls: &spawns "Command::new|^new$"
          calls-not: &bounded "(?i)timeout|wait_timeout|kill|run_bounded|deadline"
      - capture: call
        regex: &child "Command::new|\\.arg|\\.spawn\\(|child|\\.stdout"
      - capture: call
        not-regex: &runs-code "Command::new\\(\\s*\"(?:python3?|node|deno|bun|ruby|perl|php|pwsh|powershell|npx|pytest|java|dotnet|pdftotext|pdfinfo|pdftoppm|mutool|qpdf|gs|ffmpeg|ffprobe|magick|convert|tesseract|pandoc|soffice|libreoffice|unzip|7z)\"|Command::new\\(\\s*\"(?:sh|bash|zsh)\"\\)\\s*\\.args?\\(\\s*\\[?\\s*\"-c\"\\s*(?:,|\\)\\s*\\.arg\\()\\s*[^\"\\s]|Command::new\\(\\s*\"(?:cargo|go|docker|podman|npm|pnpm|yarn)\"\\)[\\s\\S]*?\"(?:test|run|exec)\""
      - reached-from: server
  - name: runs-code-or-parses-input
    query: |
      ((call_expression function: (field_expression field: (field_identifier) @m)) @call
       (#match? @m "^(output|status|wait|wait_with_output)$"))
    at: call
    where:
      - enclosing-function:
          calls: *spawns
          calls-not: *bounded
      - capture: call
        regex: *runs-code
      - reached-from: server
        unreached-confidence: 0.45
message: "`{m}()` waits for a child process with no deadline"
review:
  - Can the input (a user file, a URL, generated code) make this tool run for a long time or print without end?
  - Bound it (a timeout that kills the process group, and a cap on output).
examples:
  bad:
    - code: |
        fn text(p: &Path) -> io::Result<Output> { Command::new("pdftotext").arg(p).output() }
      reached: route
    - code: |
        fn head(dir: &Path) -> io::Result<Output> { Command::new("git").arg("rev-parse").current_dir(dir).output() }
      reached: listener
    # Code or documents run outside a server: kept, ranked lower.
    - |
      async fn adjudicate(dir: &Path) -> io::Result<Output> { tokio::process::Command::new("cargo").args(["test", "--test", "t"]).current_dir(dir).output().await }
    - |
      fn text(p: &Path) -> io::Result<Output> { Command::new("pdftotext").arg(p).output() }
    - |
      fn verify(cmd: &str) -> io::Result<Output> { Command::new("bash").arg("-c").arg(cmd).output() }
  good:
    - code: |
        async fn text(p: &Path) -> io::Result<Output> { tokio::time::timeout(T, Command::new("pdftotext").arg(p).output()).await? }
      reached: true
    - code: |
        fn n(v: &[u8]) -> usize { v.iter().map(|b| b.status()).count() }
      reached: true
    # A CLI waiting on a local tool, or on a shell script it wrote itself.
    - |
      fn head(dir: &Path) -> io::Result<Output> { Command::new("git").arg("rev-parse").current_dir(dir).output() }
    - |
      fn procs() -> io::Result<Output> { Command::new("sh").args(["-c", "ps aux | wc -l"]).output() }
    - |
      fn build(dir: &Path) -> io::Result<Output> { Command::new("cargo").arg("build").current_dir(dir).output() }
---
id: rust-network-read-without-deadline
description: >-
  An async read from a network peer (`read_line`/`read_until`/`read_exact`/
  `read_buf`) with no timeout anywhere in the function: a client that sends
  nothing holds the task, its buffer and its file descriptor forever
  (slowloris, CWE-400).
severity: low
tags: [CWE-400, dos]
language: rust
# A server's reads are the slowloris case; a client's (an SMTP or tunnel
# client reading its server) can hang too, but only on a peer it chose. On
# 10 real checkouts (2026-09) 4 of 8 reads are a server's (rms's SMTP
# session, fixed by its audit; unlace-lumina's frame reads) and 4 a
# client's (SMTP/OAuth/tunnel clients, one child pipe): those stay, ranked
# lower.
check-patterns:
  - name: read-without-timeout
    query: |
      ((await_expression (call_expression function: (field_expression field: (field_identifier) @m))) @read
       (#match? @m "^(read_line|read_until|read_exact|read_buf|read_to_end|read_to_string)$"))
    at: read
    where:
      - enclosing-function:
          calls-not: "(?i)timeout|deadline"
          is-test: false
      - capture: read
        # Files, HTTP bodies and a child process's pipes (EOF when it exits)
        # are not peers.
        not-regex: "(?i)file|fs::|stdin|stdout|stderr|child|pipe|body|response|resp\\b|res\\b"
      - reached-from: server
        unreached-confidence: 0.25
message: "`{read}` waits on a peer with no deadline"
review:
  - Is the reader a socket a remote client controls (not a file, not a trusted child)?
  - Is a timeout applied by the caller instead (`tokio::time::timeout` around the session)?
examples:
  bad:
    - code: |
        async fn cmd(r: &mut BufReader<TcpStream>, b: &mut String) -> io::Result<usize> { r.read_line(b).await }
      reached: listener
    # A client's read: kept, ranked lower.
    - |
      async fn reply(r: &mut BufReader<TcpStream>, b: &mut String) -> io::Result<usize> { r.read_line(b).await }
  good:
    - code: |
        async fn cmd(r: &mut BufReader<TcpStream>, b: &mut String) -> io::Result<usize> { timeout(IDLE, r.read_line(b)).await? }
      reached: true
    - |
      async fn read_stderr(mut stderr: ChildStderr) -> String { let mut t = String::new(); let _ = stderr.read_to_string(&mut t).await; t }
---
id: rust-unbounded-accept-spawn
description: >-
  Every accepted connection gets a task, with no cap on how many run at once
  (no semaphore, no permit): connections alone can exhaust memory and file
  descriptors (CWE-770).
severity: low
tags: [CWE-770, dos]
language: rust
check-patterns:
  - name: spawn-per-accept
    query: |
      ((call_expression function: (field_expression field: (field_identifier) @m) arguments: (arguments) @args) @accept
       (#eq? @m "accept"))
    at: accept
    where:
      - inside: "(loop_expression) @loop"
      # A listener's `accept()` takes nothing; `acceptor.accept(stream)` in
      # the spawned task is that connection's TLS handshake (reported twice
      # before, once per accept).
      - capture: args
        regex: "^\\(\\s*\\)$"
      - enclosing-function:
          calls: "spawn"
          calls-not: "(?i)semaphore|acquire|permit|limit"
message: "a task per accepted connection, with no cap on how many"
review:
  - Is this listener reachable from the internet (or from untrusted local users)?
  - Cap concurrent sessions (`tokio::sync::Semaphore::try_acquire_owned`) and refuse the rest.
examples:
  bad:
    - |
      async fn run(l: TcpListener) { loop { if let Ok((s, _)) = l.accept().await { tokio::spawn(serve(s)); } } }
  good:
    - |
      async fn run(l: TcpListener, sem: Arc<Semaphore>) { loop { if let Ok((s, _)) = l.accept().await { let Ok(p) = sem.clone().try_acquire_owned() else { continue }; tokio::spawn(serve(s, p)); } } }
    - |
      async fn handshakes(a: TlsAcceptor, mut rx: Receiver<TcpStream>) { loop { let Some(s) = rx.recv().await else { break }; let t = a.accept(s).await; tokio::spawn(serve(t)); } }
---
id: rust-guarded-resolver-behind-proxy
description: >-
  A reqwest client guards where it connects with a custom `dns_resolver`
  (dropping internal addresses) but still honours the environment's proxies.
  Through an `HTTP(S)_PROXY`/`ALL_PROXY`, reqwest resolves only the proxy's
  name: the proxy connects to the target, which the resolver never sees, so
  the guard is bypassed — and `NO_PROXY` can send a trusted proxy host a
  direct connection (CWE-918, SSRF). Found by review of a fix this rule set's
  own `rust-http-client-follows-redirects` had prompted.
severity: medium
tags: [CWE-918, ssrf]
language: rust
check-patterns:
  - name: resolver-without-no-proxy
    query: |
      ((call_expression function: (field_expression field: (field_identifier) @m)) @call
       (#eq? @m "dns_resolver"))
    at: call
    where:
      - enclosing-function:
          calls-not: "^no_proxy$"
message: "a guarded `dns_resolver` that proxies bypass: add `.no_proxy()`"
review:
  - Is the resolver a guard (it filters addresses)? A proxy resolves the target itself.
  - Does this client ever need a proxy? If so the proxy must enforce the same guard.
examples:
  bad:
    - |
      fn c(g: Arc<Guard>) -> reqwest::Client { reqwest::Client::builder().dns_resolver(g).build().unwrap() }
    - |
      fn c(g: Arc<Guard>) -> reqwest::Client { let mut b = reqwest::Client::builder(); b = b.dns_resolver(g); b.build().unwrap() }
  good:
    - |
      fn c(g: Arc<Guard>) -> reqwest::Client { reqwest::Client::builder().no_proxy().dns_resolver(g).build().unwrap() }
    - |
      fn c(g: Arc<Guard>) -> reqwest::Client { let mut b = reqwest::Client::builder().no_proxy(); b = b.dns_resolver(g); b.build().unwrap() }
